<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- interactive-widget: the on-screen keyboard makes the page shorter instead of covering the message box -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Adda" />
    <meta name="description" content="Adda is a fast, private place to talk with your people in real time." />
    <meta name="theme-color" content="#06060c" />
    <title>Adda</title>
    <script>
      // apply the saved look before the first paint so the page never flashes
      try {
        var theme = localStorage.getItem("theme");
        var accent = localStorage.getItem("accent");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        if (accent) document.documentElement.dataset.accent = accent;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
